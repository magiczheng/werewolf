<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>狼人杀 · 聚会助手</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f1020" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- black-translucent 让 env(safe-area-inset-top) 真正生效，
       顶栏的刘海避让才不会是 0 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="狼人杀" />
  <!-- iOS 的 apple-touch-icon 必须是 PNG（不支持 SVG），且须完全不透明 -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%234dd4ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230f1020'/%3E%3Cpath d='M32 13 L21 8.5 L22.5 19.5 L18 24 L20.5 34 L26 47 L32 52 L38 47 L43.5 34 L46 24 L41.5 19.5 L43 8.5 Z' fill='url(%23g)'/%3E%3C/svg%3E" />

  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <div id="app">
    <!-- 启动闪屏：模块脚本执行前先有东西可看，避免白屏；
         app.render() 首次运行时会把 #app 清空并接管 -->
    <div class="view boot">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="bootMoon" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#a78bfa"/>
                <stop offset="1" stop-color="#4dd4ff"/>
              </linearGradient>
            </defs>
            <path d="M32 13 L21 8.5 L22.5 19.5 L18 24 L20.5 34 L26 47 L32 52 L38 47 L43.5 34 L46 24 L41.5 19.5 L43 8.5 Z"
                  fill="url(#bootMoon)" fill-opacity=".92"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">狼人杀</h1>
          <p class="brand-sub">连接中…</p>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <!-- socket.io 客户端由服务端提供，无需 CDN，离线可用 -->
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
